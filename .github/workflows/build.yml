name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract and Locate Project Files
      run: |
        if [ -f "MyAI-source.zip" ]; then
          unzip -o MyAI-source.zip
        fi
        
        # If extracted into a subfolder, move everything to root
        SUBFOLDER=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        if [ "$SUBFOLDER" != "." ] && [ -n "$SUBFOLDER" ]; then
          mv $SUBFOLDER/* . 2>/dev/null || true
          mv $SUBFOLDER/.* . 2>/dev/null || true
        fi
        
        chmod +x gradlew

    - name: Update Worker URL inside Kotlin file
      run: |
        find . -name "GroqProxyProvider.kt" -exec sed -i 's|https://REPLACE-WITH-YOUR-WORKER-URL.workers.dev/chat|https://my-ai-proxy.priyobiswas817.workers.dev/chat|g' {} +

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyAI-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
