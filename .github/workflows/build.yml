name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project source (if uploaded as MyAI-source.zip)
        run: |
          if [ -f "MyAI-source.zip" ]; then
            unzip -o MyAI-source.zip -d .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Insert Worker URL from repo secret (optional)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ -n "$WORKER_URL" ]; then
            sed -i "s#https://REPLACE-WITH-YOUR-WORKER-URL.workers.dev/chat#${WORKER_URL}#g" \
              app/src/main/java/com/myai/app/network/GroqProxyProvider.kt
            echo "Worker URL injected from secret."
          else
            echo "No WORKER_URL secret set — using whatever is already in GroqProxyProvider.kt."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: My AI build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
